name: Hello Docker action
on:
  push:
    branches:
      - main
    paths:
      - hello-world-docker-action/**
  workflow_dispatch: 

jobs:
  hello-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run container
        id: hello-action
        uses: ./hello-world-docker-action
        with:
          who-to-greet: '@nnapik'
      - name: Output time in the container
        run: echo Time ${{steps.hello-action.outputs.time}}
