name: 'Hello, World, Docker action'
description: 'Say hello from the docker world'
inputs:
  who-to-greet:
    description: 'Who to greet'
    required: true
    default: 'world'
outputs:
  time:
    description: 'The time hello has been said'
runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.who-to-greet }}
